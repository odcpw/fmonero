# The file /proc/8421/cmdline names through --config-file. §2i's first probe must follow it:
# argv carries no --data-dir, so a scan that only looks at argv reports the data dir as FREE
# and `node up` starts a second writer on the LMDB (§1.2).
# boost::program_options reads this, NOT systemd: no %h/%S expansion, every path absolute
# (src/daemon/command_line_args.h:40-53, applied in src/daemon/main.cpp:215-241).
data-dir=/var/lib/monero
log-file=/var/log/monero/monero.log
log-level=0
