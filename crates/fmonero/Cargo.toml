[package]
name = "fmonero"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Monero node + wallet front end for Omarchy: CLI, doctor, FrankenTUI, bar-widget backend"

[[bin]]
name = "fmonero"
path = "src/main.rs"

# DESIGN.md §3.1: the binary takes the core set plus anyhow, clap, ftui, ftui-extras,
# unicode-width and qrcode. `ureq` is core-only — the binary never speaks HTTP (§2c).
[dependencies]
fmonero-core = { path = "../fmonero-core" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
dirs.workspace = true
toml.workspace = true
libc.workspace = true
postcard.workspace = true
sha2.workspace = true
jiff.workspace = true
md-5.workspace = true
ftui.workspace = true
ftui-extras.workspace = true
unicode-width.workspace = true
qrcode.workspace = true
